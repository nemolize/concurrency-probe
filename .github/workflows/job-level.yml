name: job-level

on:
  workflow_dispatch:
    inputs:
      trial:
        description: Trial id; runs sharing it share one concurrency group
        type: string
        required: true
      skip:
        description: Skip the only job via its `if`
        type: boolean
        default: false

jobs:
  work:
    if: ${{ !inputs.skip }}
    concurrency:
      group: job-level-${{ inputs.trial }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          echo "start $(date -u +%T)"
          sleep 75
          echo "end $(date -u +%T)"
